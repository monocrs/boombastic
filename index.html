<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mr. Boombastic</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      overflow: hidden;
    }

    /*
      The player fills the browser window.

      We DON'T enlarge a 16:9 iframe beyond the
      viewport anymore, so the video isn't cropped.
    */

    #player {
      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      border: 0;
    }


    /*
      Only shown when the browser blocks
      autoplay with sound.
    */

    #start-screen {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 9999;

      background: rgba(0, 0, 0, 0.35);

      cursor: pointer;
    }


    #start-button {
      padding: 22px 35px;

      border: 3px solid white;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(22px, 4vw, 50px);
      font-weight: bold;

      cursor: pointer;
    }

  </style>
</head>


<body>

  <div id="player"></div>


  <div id="start-screen">
    <div id="start-button">
      ▶ MR. BOOMBASTIC
    </div>
  </div>


  <script src="https://www.youtube.com/iframe_api"></script>


  <script>

    let player;


    /*
      Called automatically when the
      YouTube API has loaded.
    */

    function onYouTubeIframeAPIReady() {

      player = new YT.Player('player', {

        width: '100%',
        height: '100%',

        videoId: 'pZ-oEuWMszs',

        playerVars: {

          /* Try autoplay */
          autoplay: 1,

          /* Hide controls */
          controls: 0,

          /* Loop forever */
          loop: 1,
          playlist: 'pZ-oEuWMszs',

          /* Inline playback on mobile */
          playsinline: 1,

          /* Disable keyboard controls */
          disablekb: 1,

          /* Hide fullscreen button */
          fs: 0,

          /*
            Do NOT include cc_load_policy.

            This means we're not asking
            YouTube to force captions on.
          */

          /*
            Restrict related videos
            to the same channel.
          */
          rel: 0
        },


        events: {

          'onReady': onPlayerReady,

          'onStateChange': onPlayerStateChange,

          /*
            YouTube fires this when the
            browser rejects autoplay.
          */

          'onAutoplayBlocked': onAutoplayBlocked
        }

      });

    }



    /*
      Player is ready.

      Try to play WITH SOUND.
    */

    function onPlayerReady(event) {

      player.unMute();

      player.setVolume(100);

      player.playVideo();

    }



    /*
      If playback succeeds, make sure
      the fallback screen is hidden.
    */

    function onPlayerStateChange(event) {

      if (event.data === YT.PlayerState.PLAYING) {

        document.getElementById(
          'start-screen'
        ).style.display = 'none';

      }

    }



    /*
      Browser rejected autoplay with sound.
    */

    function onAutoplayBlocked() {

      document.getElementById(
        'start-screen'
      ).style.display = 'flex';

    }



    /*
      User clicks anywhere on fallback screen.

      This interaction allows us to request
      playback with audio again.
    */

    document.getElementById(
      'start-screen'
    ).addEventListener('click', function () {

      player.unMute();

      player.setVolume(100);

      player.playVideo();

      this.style.display = 'none';

    });

  </script>

</body>
</html>
