<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mr. Boombastic</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;
      background: #000;
    }


    /*
      FULLSCREEN CONTAINER

      Centers the video and keeps the entire
      16:9 image visible without cropping.
    */

    #video-container {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }


    /*
      Maintain the original 16:9 aspect ratio.

      This means:
      - no cropped edges
      - no stretched video
      - black bars may appear when the
        browser isn't 16:9
    */

    #video-wrapper {
      width: 100vw;
      height: 56.25vw;

      max-width: 177.7778vh;
      max-height: 100vh;
    }


    #player {
      width: 100%;
      height: 100%;
    }


    /*
      AUTOPLAY FALLBACK

      This only appears if the browser blocks
      autoplay with sound.
    */

    #start-screen {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 100;

      background: rgba(0, 0, 0, 0.35);

      cursor: pointer;
    }


    #start-button {
      padding: 20px 35px;

      border: 3px solid #fff;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(24px, 4vw, 52px);
      font-weight: bold;

      cursor: pointer;
      user-select: none;
    }

  </style>
</head>


<body>


  <!-- VIDEO -->

  <div id="video-container">

    <div id="video-wrapper">

      <div id="player"></div>

    </div>

  </div>



  <!-- AUTOPLAY FALLBACK -->

  <div id="start-screen">

    <div id="start-button">

      ▶ ENTER THE FARM

    </div>

  </div>



  <!-- YOUTUBE IFRAME API -->

  <script src="https://www.youtube.com/iframe_api"></script>


  <script>

    let player;



    /*
      YouTube API initialization
    */

    function onYouTubeIframeAPIReady() {

      player = new YT.Player('player', {

        videoId: 'pZ-oEuWMszs',


        playerVars: {

          /*
            Attempt autoplay
          */

          autoplay: 1,


          /*
            Hide YouTube controls
          */

          controls: 0,


          /*
            Loop this video continuously
          */

          loop: 1,

          playlist: 'pZ-oEuWMszs',


          /*
            Allow inline playback on phones
          */

          playsinline: 1,


          /*
            Disable keyboard controls
          */

          disablekb: 1,


          /*
            Hide YouTube fullscreen button
          */

          fs: 0,


          /*
            Limit related videos
          */

          rel: 0,


          /*
            Do NOT force captions on.

            NOTE:
            YouTube does not provide a guaranteed
            parameter for forcing a viewer's
            captions OFF.

            We therefore don't load or manipulate
            the captions module.
          */

          cc_load_policy: 0,


          /*
            Player language
          */

          hl: 'en'

        },


        events: {

          onReady: onPlayerReady,

          onStateChange: onPlayerStateChange,

          onAutoplayBlocked: onAutoplayBlocked

        }

      });

    }



    /*
      PLAYER READY

      Attempt playback WITH SOUND.
    */

    function onPlayerReady(event) {

      player.setVolume(100);

      player.unMute();

      player.playVideo();

    }



    /*
      PLAYBACK STARTED
    */

    function onPlayerStateChange(event) {

      if (event.data === YT.PlayerState.PLAYING) {

        /*
          Hide fallback screen if playback
          successfully starts.
        */

        document.getElementById(
          'start-screen'
        ).style.display = 'none';

      }

    }



    /*
      AUTOPLAY BLOCKED

      Modern browsers commonly prevent
      autoplay when audio is enabled.

      If that happens, show the button.
    */

    function onAutoplayBlocked() {

      document.getElementById(
        'start-screen'
      ).style.display = 'flex';

    }



    /*
      FALLBACK CLICK

      A user click gives the browser the
      interaction required to start playback
      with sound.
    */

    document.getElementById(
      'start-screen'
    ).addEventListener(
      'click',
      function () {

        player.setVolume(100);

        player.unMute();

        player.playVideo();

        this.style.display = 'none';

      }
    );

  </script>


</body>

</html>
