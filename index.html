<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mr. Boombastic</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    /*
      This container fills the screen and centers
      the video without cropping it.
    */
    #video-container {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: black;
    }

    /*
      Maintain the video's native 16:9 ratio.

      The JavaScript below calculates whether width
      or height is the limiting dimension.
    */
    #player {
      width: 100%;
      height: 100%;
    }

    #video-wrapper {
      width: 100vw;
      height: 56.25vw;

      max-width: 177.7778vh;
      max-height: 100vh;
    }

    /*
      Only appears when the browser refuses
      autoplay with audio.
    */
    #start-screen {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 100;

      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    #start-button {
      padding: 20px 35px;

      border: 3px solid white;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.65);

      color: white;

      font-family: Arial, sans-serif;
      font-size: clamp(24px, 4vw, 52px);
      font-weight: bold;
    }
  </style>
</head>


<body>

  <div id="video-container">
    <div id="video-wrapper">
      <div id="player"></div>
    </div>
  </div>


  <div id="start-screen">
    <div id="start-button">
      ▶ ENTER THE FARM
    </div>
  </div>


  <script src="https://www.youtube.com/iframe_api"></script>

  <script>

    let player;


    function onYouTubeIframeAPIReady() {

      player = new YT.Player('player', {

        videoId: 'pZ-oEuWMszs',

        playerVars: {

          /* Attempt autoplay */
          autoplay: 1,

          /* No YouTube controls */
          controls: 0,

          /* Loop */
          loop: 1,
          playlist: 'pZ-oEuWMszs',

          /* Mobile inline playback */
          playsinline: 1,

          /* Keyboard controls off */
          disablekb: 1,

          /* Fullscreen button off */
          fs: 0,

          /* Related videos limited */
          rel: 0
        },

        events: {

          onReady: onPlayerReady,

          onStateChange: onPlayerStateChange,

          onAutoplayBlocked: onAutoplayBlocked,

          onApiChange: onApiChange
        }

      });

    }


    function onPlayerReady() {

      /*
        Try playback WITH SOUND.
      */

      player.setVolume(100);
      player.unMute();
      player.playVideo();


      /*
        Ask YouTube to load its captions module.

        Once available, onApiChange() will attempt
        to disable the active caption track.
      */

      try {
        player.loadModule('captions');
      } catch (e) {
        console.log('Caption module unavailable');
      }

    }


    /*
      YouTube tells us when modules become available.
    */

    function onApiChange() {

      try {

        const modules = player.getOptions();

        if (
          modules.includes('captions') ||
          modules.includes('cc')
        ) {

          const module =
            modules.includes('captions')
              ? 'captions'
              : 'cc';

          /*
            Empty language code = attempt to select
            no caption track.
          */

          player.setOption(
            module,
            'track',
            {
              languageCode: ''
            }
          );

        }

      } catch (e) {

        console.log(
          'Could not override caption preference.'
        );

      }

    }


    function onPlayerStateChange(event) {

      if (event.data === YT.PlayerState.PLAYING) {

        document.getElementById(
          'start-screen'
        ).style.display = 'none';


        /*
          Try disabling captions again after
          playback actually begins.
        */

        disableCaptions();

      }

    }


    function disableCaptions() {

      try {

        const modules = player.getOptions();

        const module =
          modules.includes('captions')
            ? 'captions'
            : 'cc';

        player.setOption(
          module,
          'track',
          {
            languageCode: ''
          }
        );

      } catch (e) {

        // YouTube may ignore this depending
        // on viewer preferences.

      }

    }


    function onAutoplayBlocked() {

      document.getElementById(
        'start-screen'
      ).style.display = 'flex';

    }


    document.getElementById(
      'start-screen'
    ).addEventListener(
      'click',
      function () {

        player.unMute();
        player.setVolume(100);
        player.playVideo();

        this.style.display = 'none';

      }
    );

  </script>

</body>
</html>
