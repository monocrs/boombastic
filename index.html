<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mr. Boombastic</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;
      background: #000;
    }


    /*
      FULLSCREEN VIDEO CONTAINER

      Centers the video on the screen.
    */

    #video-container {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }


    /*
      VIDEO WRAPPER

      Keeps the original 16:9 aspect ratio.

      This prevents:
      - cropping
      - stretching
      - cutting off the edges

      If the browser isn't exactly 16:9,
      black bars may appear.
    */

    #video-wrapper {
      width: 100vw;
      height: 56.25vw;

      max-width: 177.7778vh;
      max-height: 100vh;
    }


    /*
      YouTube player fills the wrapper.
    */

    #player {
      width: 100%;
      height: 100%;
    }


    /*
      AUTOPLAY FALLBACK

      Only displayed if the browser blocks
      autoplay with sound.
    */

    #start-screen {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 100;

      background: rgba(0, 0, 0, 0.35);

      cursor: pointer;
    }


    /*
      ENTER THE FARM button
    */

    #start-button {
      padding: 20px 35px;

      border: 3px solid #fff;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.65);

      color: #fff;

      font-family: Arial, Helvetica, sans-serif;

      font-size: clamp(
        24px,
        4vw,
        52px
      );

      font-weight: bold;

      cursor: pointer;

      user-select: none;
    }

  </style>
</head>


<body>


  <!--
    VIDEO
  -->

  <div id="video-container">

    <div id="video-wrapper">

      <div id="player"></div>

    </div>

  </div>



  <!--
    AUTOPLAY FALLBACK

    This appears only if autoplay with
    sound is rejected by the browser.
  -->

  <div id="start-screen">

    <div id="start-button">

      ▶ ENTER THE FARM

    </div>

  </div>



  <!--
    YOUTUBE IFRAME PLAYER API
  -->

  <script src="https://www.youtube.com/iframe_api"></script>


  <script>

    let player;



    /*
      YouTube calls this automatically
      after the IFrame API loads.
    */

    function onYouTubeIframeAPIReady() {

      player = new YT.Player(
        'player',
        {

          videoId: 'pZ-oEuWMszs',


          playerVars: {

            /*
              Attempt automatic playback.
            */

            autoplay: 1,


            /*
              Hide normal player controls.
            */

            controls: 0,


            /*
              Loop the video.
            */

            loop: 1,

            playlist: 'pZ-oEuWMszs',


            /*
              Allow inline playback on
              mobile devices.
            */

            playsinline: 1,


            /*
              Disable YouTube keyboard
              controls.
            */

            disablekb: 1,


            /*
              Hide YouTube's fullscreen
              button.
            */

            fs: 0,


            /*
              Related videos are limited
              to the same channel.
            */

            rel: 0,


            /*
              Player interface language.

              IMPORTANT:

              There is intentionally NO
              cc_load_policy here.

              We are NOT asking YouTube
              to load captions.

              YouTube may still display
              captions if the viewer has
              captions enabled in their
              YouTube/browser preferences.
            */

            hl: 'en'

          },


          events: {

            /*
              Player has loaded.
            */

            onReady: onPlayerReady,


            /*
              Playback state changed.
            */

            onStateChange:
              onPlayerStateChange,


            /*
              YouTube specifically reports
              that autoplay was rejected.
            */

            onAutoplayBlocked:
              onAutoplayBlocked

          }

        }
      );

    }



    /*
      PLAYER READY

      Attempt to start immediately
      WITH SOUND.
    */

    function onPlayerReady(event) {

      /*
        Maximum volume.
      */

      player.setVolume(100);


      /*
        Make sure player isn't muted.
      */

      player.unMute();


      /*
        Request playback.
      */

      player.playVideo();

    }



    /*
      PLAYER STATE CHANGED
    */

    function onPlayerStateChange(event) {

      /*
        Playback successfully started.
      */

      if (
        event.data ===
        YT.PlayerState.PLAYING
      ) {

        /*
          Hide the fallback overlay.
        */

        document
          .getElementById(
            'start-screen'
          )
          .style
          .display = 'none';

      }

    }



    /*
      AUTOPLAY BLOCKED

      Browsers may reject automatic
      playback when sound is enabled.

      YouTube reports that through the
      onAutoplayBlocked event.
    */

    function onAutoplayBlocked() {

      document
        .getElementById(
          'start-screen'
        )
        .style
        .display = 'flex';

    }



    /*
      FALLBACK CLICK

      Clicking the overlay counts as
      user interaction.

      We can therefore request playback
      with audio again.
    */

    document
      .getElementById(
        'start-screen'
      )
      .addEventListener(
        'click',
        function () {

          /*
            Make sure audio is enabled.
          */

          player.setVolume(100);

          player.unMute();


          /*
            Start video.
          */

          player.playVideo();


          /*
            Remove overlay.
          */

          this.style.display = 'none';

        }
      );

  </script>


</body>

</html>
