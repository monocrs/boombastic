<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr. Boombastic</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Fullscreen 16:9 YouTube video.
       The excess is cropped so there are no black bars. */
    #player {
      position: fixed;
      top: 50%;
      left: 50%;

      width: 100vw;
      height: 56.25vw;

      min-width: 177.78vh;
      min-height: 100vh;

      transform: translate(-50%, -50%);
      border: 0;
    }

    /* Fallback shown if the browser blocks
       autoplay with sound. */
    #enter {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 10;

      background: rgba(0, 0, 0, 0.75);

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(24px, 5vw, 64px);
      font-weight: bold;
      color: white;

      cursor: pointer;
      user-select: none;
    }

    #enter span {
      padding: 25px 40px;
      border: 3px solid white;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <!-- YouTube player -->
  <div id="player"></div>

  <!-- Only appears if autoplay with sound is blocked -->
  <div id="enter">
    <span>▶ ENTER THE FARM</span>
  </div>


  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let autoplayCheck;

    function onYouTubeIframeAPIReady() {

      player = new YT.Player('player', {

        videoId: 'pZ-oEuWMszs',

        playerVars: {

          /* Attempt autoplay */
          autoplay: 1,

          /* Hide player controls */
          controls: 0,

          /* Loop the video */
          loop: 1,
          playlist: 'pZ-oEuWMszs',

          /* Play inline on mobile */
          playsinline: 1,

          /* Reduce related-video behavior */
          rel: 0,

          /* Don't force captions on */
          cc_load_policy: 0,

          /* Keyboard controls off */
          disablekb: 1,

          /* Don't display fullscreen button etc. */
          fs: 0
        },

        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange
        }
      });
    }


    function onPlayerReady(event) {

      /*
       * IMPORTANT:
       * We deliberately DO NOT mute the player.
       *
       * This asks the browser to autoplay
       * the video WITH SOUND.
       */

      player.setVolume(100);
      player.unMute();
      player.playVideo();


      /*
       * Give the browser/player a moment.
       *
       * If playback hasn't started, assume
       * autoplay with sound was blocked and
       * display the ENTER THE FARM button.
       */

      autoplayCheck = setTimeout(function () {

        if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
          showEnterButton();
        }

      }, 1500);
    }


    function onPlayerStateChange(event) {

      if (event.data === YT.PlayerState.PLAYING) {

        clearTimeout(autoplayCheck);

        document.getElementById('enter').style.display = 'none';
      }
    }


    function showEnterButton() {

      document.getElementById('enter').style.display = 'flex';
    }


    /*
     * Clicking ENTER THE FARM counts as
     * user interaction, so browsers should
     * then permit playback with sound.
     */

    document.getElementById('enter').addEventListener('click', function () {

      player.unMute();
      player.setVolume(100);
      player.playVideo();

      this.style.display = 'none';
    });
  </script>

</body>
</html>
